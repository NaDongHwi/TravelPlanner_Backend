spring.application.name=planner
# 1. 데이터베이스 연결 설정 (MariaDB)
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3306/planner?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=1234

# 2. JPA (데이터베이스 조작 도구) 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 3. 외부 환경 변수 및 보안 파일 연결 설정
# application-secret.yml 파일에 숨겨둔 API 키 값들을 서버 실행 시 함께 불러옵니다.
spring.profiles.include=secret

# 4. Swagger API 문서 접속 주소 설정
springdoc.swagger-ui.path=/api-docs

# 5. 관리자 / 보안 / 배치 설정
# 관리자 API(/api/v1/admin/**, /api/test/**)를 쓸 수 있는 계정 이메일 (쉼표로 여러 개). 비워 두면 아무도 접근할 수 없습니다.
app.admin-emails=
# 소셜 로그인 성공 후 돌아갈 프론트엔드 주소 (토큰은 #token=... 프래그먼트로 전달)
app.oauth2.redirect-uri=http://localhost:3000/oauth2/callback
# 개인정보 컬럼 암호화 키. 비워 두면 jwt.secret 에서 유도한 별도 키를 씁니다. 운영에서는 application-secret.yml 에 따로 지정하세요.
# (한 번 정한 뒤 바꾸면 기존 암호화 데이터를 읽을 수 없습니다)
app.crypto.secret=
# 30일 갱신 배치가 하룻밤에 구글에 다시 조회하는 장소 수 상한
app.refresh.max-places-per-night=150
